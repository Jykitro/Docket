name: Release

# Push a tag like v0.1.0 to publish the server and plandillo-cli binaries, checksums, release notes, the Homebrew
# cask and a Docker image. v0.x tags are the development releases; a suffix such as -rc.1 marks a pre-release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the changelog is built from commit history
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json
      - run: make install web # the UI is embedded into the binary, so build it first
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: without it the cask is not pushed to huntly-digital/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          # Optional: with all five the macOS CLI is signed with Developer ID and notarized.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
