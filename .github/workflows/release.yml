name: Release

# Push a tag like v0.1.0 to publish binaries, checksums, release notes and a Docker image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # the changelog is built from commit history
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json
      - run: make install web # the UI is embedded into the binary, so build it first
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
