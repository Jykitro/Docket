name: CI

# Landing-only changes deploy on Vercel and never touch the app, so they skip tests and the image build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "landing/**"
      - vercel.json
      - .vercelignore
  pull_request:
    paths-ignore:
      - "landing/**"
      - vercel.json
      - .vercelignore

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: web/package.json
      - run: make install
      - run: make check

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19.0-alpine
        env:
          POSTGRES_USER: docket
          POSTGRES_PASSWORD: docket_test_only
          POSTGRES_DB: docket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket -d docket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCKET_TEST_POSTGRES_DSN: postgres://docket:docket_test_only@localhost:5432/docket_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - run: make test-postgres

  docker:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, postgres]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
