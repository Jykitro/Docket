# Single-server selfhost with an isolated Code Mode worker. Use behind an HTTPS reverse proxy.
services:
  plandillo:
    build: .
    user: "${PLANDILLO_UID:-${DOCKET_UID:-65532}}:${PLANDILLO_GID:-${DOCKET_GID:-65532}}"
    group_add: ["65532"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7777:7777"
    environment:
      PLANDILLO_MODE: selfhost
      PLANDILLO_POSTGRES_DSN: ${PLANDILLO_POSTGRES_DSN:-${DOCKET_POSTGRES_DSN:-}}
      PLANDILLO_TRUSTED_PROXIES: ${PLANDILLO_TRUSTED_PROXIES:-${DOCKET_TRUSTED_PROXIES:-}}
      PLANDILLO_TOTP_KEY: ${PLANDILLO_TOTP_KEY:-}
      PLANDILLO_PASSKEY_ORIGIN: ${PLANDILLO_PASSKEY_ORIGIN:-${DOCKET_PASSKEY_ORIGIN:-}}
      PLANDILLO_ALLOWED_HOSTS: ${PLANDILLO_ALLOWED_HOSTS:-${DOCKET_ALLOWED_HOSTS:-localhost,127.0.0.1,plandillo.localhost}}
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
      - code_socket:/run/plandillo-code:ro

  code-runner:
    build: .
    command: ["code-runner"]
    user: "65532:65532"
    restart: unless-stopped
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 64
    volumes:
      - code_socket:/run/plandillo-code

volumes:
  code_socket:
