# Single-user Plandillo with Code Mode. Keep the host port on loopback.
services:
  plandillo:
    extends: {file: compose.selfhost.yml, service: plandillo}
    environment:
      PLANDILLO_MODE: local
      PLANDILLO_MCP_TOKEN: ${PLANDILLO_MCP_TOKEN:-${DOCKET_MCP_TOKEN:-}}
      PLANDILLO_SEED: ${PLANDILLO_SEED:-${DOCKET_SEED:-}}
  code-runner:
    extends: {file: compose.selfhost.yml, service: code-runner}
volumes:
  code_socket:
