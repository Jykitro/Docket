version: 2

project_name: plandillo

builds:
  - &native
    id: plandillo
    main: ./cmd/docket
    binary: plandillo
    env: [CGO_ENABLED=0] # modernc SQLite is pure Go
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

  - <<: *native
    id: docket
    binary: docket

archives:
  - &archive
    id: plandillo
    ids: [plandillo]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, .env.example]

  - <<: *archive
    id: docket
    ids: [docket]
    name_template: 'docket_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 2
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
