version: 2

project_name: docket

builds:
  - main: ./cmd/docket
    binary: docket
    env: [CGO_ENABLED=0] # modernc SQLite is pure Go
    flags: [-trimpath]
    ldflags: ["-s -w"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, .env.example]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 2
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
