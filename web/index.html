<!doctype html>
<html lang="ru" class="bg-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/docket-icon-v2.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#171717" />
    <title>Docket</title>
    <!-- Apply the saved theme before the first paint (same rule as src/theme.ts) so there is no flash. -->
    <script>
      try {
        var p = localStorage.getItem('docket-theme')
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg font-sans text-sm text-tx">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
