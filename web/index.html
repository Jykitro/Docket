<!doctype html>
<html lang="ru" class="bg-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/plandillo-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#261c36" />
    <meta name="description" content="Plandillo — планировщик задач для вас и вашего ИИ-агента. Планируйте в браузере и обновляйте задачи через MCP." />
    <title>Plandillo</title>
    <!-- Apply the saved theme before the first paint (same rule as src/theme.ts) so there is no flash. -->
    <script>
      try {
        var p = localStorage.getItem('plandillo-theme')
        var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        // Appearance choices (src/theme.ts useLookPref); styles.css reads the data-* attributes.
        ;['accent', 'radius', 'scale', 'weight', 'font', 'density', 'start', 'keys', 'dates'].forEach(function (k) {
          var v = localStorage.getItem('plandillo-' + k)
          if (v) document.documentElement.dataset[k] = v
          if (v && k === 'scale') document.documentElement.style.setProperty('--zoom', v / 100)
        })
      } catch (e) {}
    </script>
  </head>
  <body class="bg-bg font-sans text-sm text-tx">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
